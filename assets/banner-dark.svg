<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="title">
  <title id="title">Stjepan Mamuša: Backend engineer · Java &amp; Spring Boot</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e56f37" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e56f37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    @keyframes rise-a { 0% { transform: translate(0,0); opacity: 0 } 15% { opacity: 1 } 100% { transform: translate(-14px,-110px); opacity: 0 } }
    @keyframes rise-b { 0% { transform: translate(0,0); opacity: 0 } 15% { opacity: 1 } 100% { transform: translate(10px,-120px); opacity: 0 } }
    @keyframes rise-c { 0% { transform: translate(0,0); opacity: 0 } 20% { opacity: .9 } 100% { transform: translate(-4px,-100px); opacity: 0 } }
    @keyframes flicker { 0%,100% { opacity: .8 } 50% { opacity: 1 } }
    @keyframes sway { 0%,100% { transform: scale(1,1) skewX(0deg) } 30% { transform: scale(.96,1.05) skewX(-2deg) } 65% { transform: scale(1.03,.95) skewX(2deg) } }
    .glow { animation: flicker 2.4s ease-in-out infinite; }
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 1.8s ease-in-out infinite; }
    .flame.f2 { animation-duration: 1.4s; animation-delay: -.5s; }
    .flame.f3 { animation-duration: 1.1s; animation-delay: -.2s; }
    @media (prefers-reduced-motion: reduce) {
      .ember { animation: none !important; opacity: .7; }
      .glow, .flame { animation: none !important; }
    }
  </style>

  <rect x="1" y="1" width="958" height="278" rx="14" fill="#0b141c" stroke="#222b33" stroke-width="2"/>

  <text class="mono" x="56" y="92" font-size="18" letter-spacing="0.5" fill="#e56f37">Java backend · Split, Croatia · CET</text>
  <text class="sans" x="54" y="160" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#f3f3f3">Stjepan Mamuša</text>
  <text class="sans" x="56" y="208" font-size="26" fill="#9aa7b3">Backend engineer · Java &amp; Spring Boot</text>
  <rect x="56" y="230" width="48" height="3" rx="1.5" fill="#e56f37"/>

  <g aria-hidden="true">
    <ellipse class="glow" cx="834" cy="206" rx="110" ry="80" fill="url(#glow)"/>
    <g transform="translate(834 236)">
      <path class="flame f1" d="M0 0 C-44 0 -44 -53.1 0 -118 C44 -53.1 44 0 0 0Z" fill="#e56f37"/>
      <path class="flame f2" d="M0 0 C-30 0 -30 -37.800000000000004 0 -84 C30 -37.800000000000004 30 0 0 0Z" fill="#ff9a66"/>
      <path class="flame f3" d="M0 0 C-17 0 -17 -21.6 0 -48 C17 -21.6 17 0 0 0Z" fill="#ffdbcd"/>
      <rect x="-62" y="-8" width="124" height="16" rx="8" fill="#57423a" transform="rotate(-12)"/>
      <rect x="-62" y="-8" width="124" height="16" rx="8" fill="#57423a" transform="rotate(12)"/>
    </g>
    <circle class="ember" cx="820" cy="140" r="2.6" fill="#e56f37" transform="translate(-6 -10)" style="animation:rise-a 3.4s ease-out 0s infinite backwards"/>
    <circle class="ember" cx="840" cy="140" r="3.4" fill="#ffb597" transform="translate(0 -33)" style="animation:rise-b 4.1s ease-out 0.9s infinite backwards"/>
    <circle class="ember" cx="850" cy="140" r="2.2" fill="#e99b75" transform="translate(6 -56)" style="animation:rise-c 3s ease-out 1.6s infinite backwards"/>
    <circle class="ember" cx="830" cy="140" r="2.8" fill="#e56f37" transform="translate(-6 -79)" style="animation:rise-a 3.7s ease-out 2.3s infinite backwards"/>
    <circle class="ember" cx="856" cy="140" r="3" fill="#ffb597" transform="translate(0 -32)" style="animation:rise-b 4.4s ease-out 0.5s infinite backwards"/>
    <circle class="ember" cx="814" cy="140" r="2" fill="#e99b75" transform="translate(6 -55)" style="animation:rise-c 3.2s ease-out 2.9s infinite backwards"/>
    <circle class="ember" cx="844" cy="140" r="2.4" fill="#e56f37" transform="translate(-6 -78)" style="animation:rise-a 3.6s ease-out 1.2s infinite backwards"/>
    <circle class="ember" cx="824" cy="140" r="3.1" fill="#ffb597" transform="translate(0 -31)" style="animation:rise-b 4s ease-out 3.4s infinite backwards"/>
  </g>
</svg>
